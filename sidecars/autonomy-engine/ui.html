<!DOCTYPE html>
<html lang="vi" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BHIT Autonomy Engine</title>
  <script src="/preload.js"></script>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#eef2ff',
              400: '#818cf8',
              500: '#6366f1',
              600: '#4f46e5',
            },
            surface: {
              DEFAULT: '#0b0f19',
              card: 'rgba(30, 41, 59, 0.45)',
              cardHover: 'rgba(30, 41, 59, 0.7)',
              border: 'rgba(255, 255, 255, 0.08)',
            }
          },
          fontFamily: {
            mono: ['JetBrains Mono', 'ui-monospace', 'SFMono-Regular', 'monospace'],
            sans: ['IBM Plex Sans', '-apple-system', 'BlinkMacSystemFont', 'Segoe UI', 'Roboto', 'sans-serif'],
          }
        }
      }
    };
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    body {
      background-color: var(--background, #0b0f19);
      color: var(--foreground, #f8fafc);
      font-family: 'IBM Plex Sans', -apple-system, sans-serif;
    }
    @keyframes pulse-ring {
      0% { transform: scale(0.6); opacity: 0.9; }
      100% { transform: scale(2.2); opacity: 0; }
    }
    .animate-pulse-ring {
      animation: pulse-ring 2s cubic-bezier(0.24, 0, 0.38, 1) infinite;
    }
  </style>
</head>
<body class="p-3.5 antialiased selection:bg-indigo-500/30 selection:text-indigo-200">
  <div id="app"></div>

  <!-- Preact & HTM via ESM -->
  <script type="module">
    import { h, render } from 'https://esm.sh/preact@10.26.2';
    import { useState, useEffect, useRef } from 'https://esm.sh/preact@10.26.2/hooks';
    import htm from 'https://esm.sh/htm@3.1.1';

    const html = htm.bind(h);

    // Lucide SVG Icons (Zero Emoji)
    const Icons = {
      Zap: () => html`<svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"></polygon></svg>`,
      Activity: () => html`<svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"></polyline></svg>`,
      Refresh: () => html`<svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.57-8.38l5.67-5.67"></path></svg>`,
      Reload: () => html`<svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"></path><path d="M21 3v5h-5"></path><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"></path><path d="M3 21v-5h5"></path></svg>`,
      ExternalLink: () => html`<svg class="w-3 h-3" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path><polyline points="15 3 21 3 21 9"></polyline><line x1="10" y1="14" x2="21" y2="3"></line></svg>`,
      Check: () => html`<svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="20 6 9 17 4 12"></polyline></svg>`,
      Clock: () => html`<svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>`,
      AlertCircle: () => html`<svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="12"></line><line x1="12" y1="16" x2="12.01" y2="16"></line></svg>`,
      Inbox: () => html`<svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="22 12 16 12 14 15 10 15 8 12 2 12"></polyline><path d="M5.45 5.11L2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z"></path></svg>`,
      Moon: () => html`<svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>`,
      Database: () => html`<svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><ellipse cx="12" cy="5" rx="9" ry="3"></ellipse><path d="M21 12c0 1.66-4 3-9 3s-9-1.34-9-3"></path><path d="M3 5v14c0 1.66 4 3 9 3s9-1.34 9-3V5"></path></svg>`,
      Target: () => html`<svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"></circle><circle cx="12" cy="12" r="6"></circle><circle cx="12" cy="12" r="2"></circle></svg>`,
      Play: () => html`<svg class="w-3 h-3 fill-current" viewBox="0 0 24 24"><polygon points="5 3 19 12 5 21 5 3"></polygon></svg>`,
      Trash: () => html`<svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>`,
      X: () => html`<svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>`,
      Sparkles: () => html`<svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon></svg>`,
      Shield: () => html`<svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path></svg>`,
      ChevronDown: () => html`<svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"></polyline></svg>`
    };

    // API Bridge
    async function apiRequest(path, body = {}) {
      const fetchFn = window.sidecar?.fetch || fetch;
      const res = await fetchFn(path, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body),
      });
      const data = await res.json();
      if (!res.ok || data.error) throw new Error(data.error || 'Request failed');
      return data;
    }

    function App() {
      const [activeTab, setActiveTab] = useState('state');
      const [data, setData] = useState(null);
      const [loading, setLoading] = useState(true);
      const [toast, setToast] = useState(null);
      const [selectedPath, setSelectedPath] = useState('');
      const [workspaceUris, setWorkspaceUris] = useState([]);
      const [newSched, setNewSched] = useState({ type: 'TIMER', time: '', desc: '' });
      const [inboxNotes, setInboxNotes] = useState({});

      const showToast = (msg, type = 'info') => {
        setToast({ msg, type });
        setTimeout(() => setToast(null), 3600);
      };

      const loadData = async (targetPath = selectedPath) => {
        try {
          const res = await apiRequest('/api/dashboard', {
            workspacePath: targetPath,
            workspaceUris,
          });
          setData(res);
          if (res.activeProject) {
            setSelectedPath(res.activeProject.workspace_path);
          }
        } catch (err) {
          showToast(err.message, 'error');
        } finally {
          setLoading(false);
        }
      };

      useEffect(() => {
        loadData();
        const interval = setInterval(() => loadData(), 15000);
        if (window.sidecar?.onWorkspaceChange) {
          window.sidecar.onWorkspaceChange((uris) => {
            setWorkspaceUris(uris || []);
            loadData();
          });
        }
        return () => clearInterval(interval);
      }, [selectedPath]);

      const handleSelectProject = (e) => {
        const path = e.target.value;
        setSelectedPath(path);
        loadData(path);
      };

      const handleReconcile = async () => {
        if (!selectedPath) return;
        showToast('Đang gửi lệnh Đồng bộ & Đánh thức Agent...', 'info');
        try {
          await apiRequest('/api/wake-now', { workspacePath: selectedPath, mode: 'RECONCILE' });
          showToast('Đã phát tín hiệu Đồng bộ & Đánh thức Agent!', 'success');
          loadData();
        } catch (err) {
          showToast(err.message, 'error');
        }
      };

      const handleToggleAutoWake = async (checked) => {
        if (!selectedPath) return;
        try {
          await apiRequest('/api/toggle-auto-wake', { workspacePath: selectedPath, autoWake: checked });
          showToast(checked ? 'Đã bật bảo vệ tự động 24/7' : 'Đã tạm dừng tự động đánh thức', 'info');
          loadData();
        } catch (err) {
          showToast(err.message, 'error');
        }
      };

      const handleRunOpenLoop = async (timeStr, desc) => {
        showToast('Đang giao Open Loop cho Agent...', 'info');
        try {
          await apiRequest('/api/wake-now', {
            workspacePath: selectedPath,
            mode: 'OPEN_LOOP',
            loopTime: timeStr,
            loopDescription: desc,
          });
          showToast('Đã kích hoạt Agent thực thi!', 'success');
          loadData();
        } catch (err) {
          showToast(err.message, 'error');
        }
      };

      const handleToggleOpenLoop = async (timeStr, done) => {
        try {
          await apiRequest('/api/toggle-open-loop', { workspacePath: selectedPath, timeStr, done });
          loadData();
        } catch (err) {
          showToast(err.message, 'error');
        }
      };

      const handleInboxDecision = async (inboxId, decision) => {
        const userNote = inboxNotes[inboxId] || '';
        showToast(`Đang cập nhật ${inboxId} -> ${decision}...`, 'info');
        try {
          await apiRequest('/api/inbox-decision', {
            workspacePath: selectedPath,
            inboxId,
            decision,
            userNote,
            wakeAgent: true,
          });
          showToast(`Đã ${decision} ${inboxId} & đánh thức Agent!`, 'success');
          loadData();
        } catch (err) {
          showToast(err.message, 'error');
        }
      };

      const handleAddSchedule = async () => {
        if (!newSched.time || !newSched.desc) {
          showToast('Vui lòng nhập mốc thời gian và nội dung.', 'error');
          return;
        }
        try {
          await apiRequest('/api/add-schedule', {
            workspacePath: selectedPath,
            scheduleType: newSched.type,
            cronOrTime: newSched.time,
            taskDescription: newSched.desc,
          });
          setNewSched({ type: 'TIMER', time: '', desc: '' });
          showToast('Đã lưu lịch trình cố định vào SQLite!', 'success');
          loadData();
        } catch (err) {
          showToast(err.message, 'error');
        }
      };

      const handleDeleteSchedule = async (id) => {
        try {
          await apiRequest('/api/delete-schedule', { id });
          showToast('Đã xóa lịch trình.', 'info');
          loadData();
        } catch (err) {
          showToast(err.message, 'error');
        }
      };

      const handleTriggerDreamer = async () => {
        showToast('Đang kích hoạt chu trình hợp nhất ký ức...', 'info');
        try {
          await apiRequest('/api/wake-now', { workspacePath: selectedPath, mode: 'DREAMER' });
          showToast('Đã gọi Subagent cognitive-dreamer!', 'success');
          loadData();
        } catch (err) {
          showToast(err.message, 'error');
        }
      };

      const handleOpenConversation = () => {
        const convId = data?.activeProject?.active_conversation_id;
        if (convId && window.sidecar?.ui?.toggleConversation) {
          window.sidecar.ui.toggleConversation(convId);
        }
      };

      const handleOpenFile = async (uri, path) => {
        if (!uri && !path) return;
        const targetUri = uri || (path ? ('file:///' + path.replace(/\\/g, '/')) : '');

        // 1. Kích hoạt trực tiếp tab 'Open File' (fileView) nguyên bản của Antigravity trên Auxiliary Pane
        let auxTriggered = false;
        try {
          if (window.sidecar?.ui?.toggleAuxPane) {
            window.sidecar.ui.toggleAuxPane({ tabType: 'fileView', uri: targetUri });
            auxTriggered = true;
          }
          if (window.parent && window.parent !== window) {
            window.parent.postMessage({
              type: 'toggle-aux-pane',
              payload: { tabType: 'fileView', uri: targetUri }
            }, '*');
            auxTriggered = true;
          }
        } catch (err) {
          console.error('Lỗi khi gửi toggle-aux-pane:', err);
        }

        if (auxTriggered) {
          showToast('Đã kích hoạt tab File Viewer trên Antigravity!', 'success');
        }

        // 2. Dự phòng nếu mở trong tab browser độc lập ngoài Antigravity
        if (!window.parent || window.parent === window) {
          try {
            await apiRequest('/api/open-file', { fileUri: targetUri, filePath: path });
            showToast('Đã mở file trong trình soạn thảo!', 'success');
          } catch (err) {
            showToast(err.message, 'error');
          }
        }
      };

      const proj = data?.activeProject;
      const cog = data?.cognition;
      const pendingInboxCount = cog?.inboxItems?.filter(i => i.status === 'PENDING').length || 0;
      const totalSchedCount = (cog?.schedules?.length || 0) + (cog?.customSchedules?.length || 0);

      return html`
        <div class="flex flex-col gap-3 max-w-full">
          <!-- Header Bar -->
          <header class="flex items-center justify-between pb-3 border-b border-white/10 gap-2 flex-wrap">
            <div class="flex items-center gap-2.5">
              <div class="w-8 h-8 rounded-lg bg-gradient-to-tr from-blue-600 to-indigo-600 flex items-center justify-center text-white shadow-lg shadow-indigo-500/20">
                <${Icons.Zap} />
              </div>
              <div>
                <div class="flex items-center gap-1.5 font-bold text-sm tracking-tight">
                  <span>BHIT Autonomy Engine</span>
                  <span class="text-[10px] px-1.5 py-0.5 rounded bg-indigo-500/15 text-indigo-400 font-semibold border border-indigo-500/30">PREACT</span>
                </div>
                <div class="flex items-center gap-1.5 text-xs text-slate-400">
                  <${Icons.Activity} />
                  <span>${data ? `${data.daemon.serverTime} • #${data.daemon.tickCount}` : 'Connecting...'}</span>
                </div>
              </div>
            </div>
            
            <div class="inline-flex items-center gap-2 px-2.5 py-1 rounded-full text-xs font-semibold bg-emerald-500/10 text-emerald-400 border border-emerald-500/25">
              <div class="relative flex h-2 w-2">
                <span class="animate-pulse-ring absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-75"></span>
                <span class="relative inline-flex rounded-full h-2 w-2 bg-emerald-500"></span>
              </div>
              <span>Auto-Resurrect Active</span>
            </div>
          </header>

          <!-- Workspace Selector & Quick Actions -->
          <div class="flex items-center gap-2">
            <div class="relative flex-1">
              <select
                value=${selectedPath}
                onChange=${handleSelectProject}
                class="w-full bg-slate-900/60 text-slate-200 border border-white/10 rounded-lg px-3 py-1.5 pr-8 text-xs font-medium focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 cursor-pointer transition-all"
              >
                ${data?.projects?.map(p => html`
                  <option key=${p.workspace_path} value=${p.workspace_path}>
                    ${p.name} (${p.workspace_path})
                  </option>
                `)}
              </select>
              <div class="absolute right-2.5 top-1/2 -translate-y-1/2 pointer-events-none text-slate-400">
                <${Icons.ChevronDown} />
              </div>
            </div>

            <button
              onClick=${handleReconcile}
              title="Khôi phục lịch trình bị hủy sau khi tắt Antigravity và chạy bù tác vụ quá hạn"
              class="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-lg text-xs font-semibold bg-gradient-to-r from-blue-600 to-indigo-600 text-white shadow-md shadow-indigo-600/20 hover:opacity-95 active:scale-95 transition-all cursor-pointer"
            >
              <${Icons.Refresh} />
              <span>Đồng bộ</span>
            </button>

            <button
              onClick=${() => loadData()}
              title="Làm mới trạng thái"
              class="p-1.5 rounded-lg text-slate-300 bg-slate-800/60 border border-white/10 hover:bg-slate-700/60 active:scale-95 transition-all cursor-pointer"
            >
              <${Icons.Reload} />
            </button>
          </div>

          <!-- Project Meta & 24/7 Switch -->
          ${proj && html`
            <div class="flex items-center justify-between px-3 py-2 rounded-lg bg-slate-900/40 border border-white/10 text-xs text-slate-300">
              <div class="flex items-center gap-2">
                <span class="text-slate-400">Phiên:</span>
                <span class="font-mono text-indigo-400 font-medium">
                  ${proj.active_conversation_id ? proj.active_conversation_id.slice(0, 13) + '...' : 'Tự tạo mới'}
                </span>
                ${proj.active_conversation_id && html`
                  <button
                    onClick=${handleOpenConversation}
                    class="inline-flex items-center gap-1 px-1.5 py-0.5 rounded bg-slate-800 hover:bg-slate-700 text-slate-300 text-[11px] cursor-pointer transition-all"
                  >
                    <${Icons.ExternalLink} />
                    <span>Mở Chat</span>
                  </button>
                `}
              </div>
              <label class="inline-flex items-center gap-2 cursor-pointer select-none">
                <input
                  type="checkbox"
                  checked=${Boolean(proj.auto_wake)}
                  onChange=${(e) => handleToggleAutoWake(e.target.checked)}
                  class="rounded border-slate-700 bg-slate-800 text-indigo-600 focus:ring-0 cursor-pointer h-3.5 w-3.5"
                />
                <span class="text-[11px]">Đánh thức 24/7</span>
              </label>
            </div>
          `}

          <!-- Segmented Navigation Tabs -->
          <nav class="flex p-1 gap-1 bg-slate-950/60 border border-white/10 rounded-lg text-xs font-semibold">
            <button
              onClick=${() => setActiveTab('state')}
              class="flex-1 inline-flex items-center justify-center gap-1.5 py-1.5 rounded-md transition-all cursor-pointer ${activeTab === 'state' ? 'bg-white/10 text-white shadow' : 'text-slate-400 hover:text-slate-200'}"
            >
              <${Icons.Zap} />
              <span>Bàn làm việc</span>
            </button>

            <button
              onClick=${() => setActiveTab('schedule')}
              class="flex-1 inline-flex items-center justify-center gap-1.5 py-1.5 rounded-md transition-all cursor-pointer ${activeTab === 'schedule' ? 'bg-white/10 text-white shadow' : 'text-slate-400 hover:text-slate-200'}"
            >
              <${Icons.Clock} />
              <span>Lịch trình</span>
              <span class="px-1.5 py-0.2 rounded-full text-[10px] bg-indigo-500/20 text-indigo-300 border border-indigo-500/30 font-bold">${totalSchedCount}</span>
            </button>

            <button
              onClick=${() => setActiveTab('inbox')}
              class="flex-1 inline-flex items-center justify-center gap-1.5 py-1.5 rounded-md transition-all cursor-pointer ${activeTab === 'inbox' ? 'bg-white/10 text-white shadow' : 'text-slate-400 hover:text-slate-200'}"
            >
              <${Icons.Inbox} />
              <span>INBOX</span>
              <span class="px-1.5 py-0.2 rounded-full text-[10px] ${pendingInboxCount > 0 ? 'bg-amber-500/20 text-amber-300 border border-amber-500/30 animate-pulse font-bold' : 'bg-slate-800 text-slate-400'}">${pendingInboxCount}</span>
            </button>

            <button
              onClick=${() => setActiveTab('dreams')}
              class="flex-1 inline-flex items-center justify-center gap-1.5 py-1.5 rounded-md transition-all cursor-pointer ${activeTab === 'dreams' ? 'bg-white/10 text-white shadow' : 'text-slate-400 hover:text-slate-200'}"
            >
              <${Icons.Moon} />
              <span>Ký ức</span>
            </button>
          </nav>

          <!-- Tab 1: STATE (Bàn làm việc) -->
          ${activeTab === 'state' && html`
            <div class="flex flex-col gap-3">
              <!-- Goal Progress Card -->
              <div class="p-3.5 rounded-xl bg-slate-900/40 border border-white/10 flex flex-col gap-2">
                <div class="flex items-center justify-between">
                  <div class="flex items-center gap-1.5 text-xs font-semibold uppercase tracking-wider text-slate-400">
                    <${Icons.Target} />
                    <span>Tiến độ Mục tiêu (Goal Progress)</span>
                  </div>
                  <span class="font-mono text-[11px] px-2 py-0.5 rounded bg-indigo-500/15 text-indigo-300 font-semibold border border-indigo-500/25">
                    ${cog?.goalProgress?.cycle || 'Active Cycle'}
                  </span>
                </div>

                <div class="flex flex-col gap-1 text-xs">
                  ${cog?.goalProgress?.metrics?.map((m, idx) => html`
                    <div key=${idx} class="flex items-baseline gap-2 text-slate-200">
                      <span class="text-indigo-400 font-bold">•</span>
                      <span>${m}</span>
                    </div>
                  `)}
                </div>

                ${cog?.goalProgress?.goalGap && html`
                  <div class="mt-1 p-2.5 rounded-lg bg-indigo-500/10 border-l-2 border-indigo-500 text-xs">
                    <span class="font-semibold text-indigo-300">Goal Gap: </span>
                    <span class="text-slate-200">${cog.goalProgress.goalGap}</span>
                  </div>
                `}
              </div>

              <!-- Open Loops Card -->
              <div class="p-3.5 rounded-xl bg-slate-900/40 border border-white/10 flex flex-col gap-2">
                <div class="flex items-center justify-between pb-1 border-b border-white/5">
                  <div class="flex items-center gap-1.5 text-xs font-semibold uppercase tracking-wider text-slate-400">
                    <${Icons.Activity} />
                    <span>Các Vòng Lặp Đang Mở (Open Loops)</span>
                  </div>
                  <span class="text-[11px] px-2 py-0.5 rounded-full bg-slate-800 text-slate-300 font-medium">
                    ${cog?.openLoops?.filter(l => !l.done).length || 0} đang mở
                  </span>
                </div>

                <div class="flex flex-col divide-y divide-white/5">
                  ${cog?.openLoops?.map((loop, idx) => {
                    let badgeClass = 'bg-indigo-500/15 text-indigo-300 border-indigo-500/25';
                    let badgeLabel = 'Sắp tới';
                    if (loop.done) {
                      badgeClass = 'bg-emerald-500/15 text-emerald-300 border-emerald-500/25';
                      badgeLabel = 'Hoàn thành';
                    } else if (loop.status === 'OVERDUE') {
                      badgeClass = 'bg-rose-500/15 text-rose-300 border-rose-500/25 animate-pulse';
                      badgeLabel = `Quá hạn (${Math.abs(loop.diffMinutes)}p)`;
                    } else if (loop.status === 'DUE_SOON') {
                      badgeClass = 'bg-amber-500/15 text-amber-300 border-amber-500/25';
                      badgeLabel = `Còn ${loop.diffMinutes}p`;
                    }

                    return html`
                      <div key=${idx} class="py-2.5 flex items-start justify-between gap-2.5">
                        <div class="flex items-start gap-2.5 flex-1">
                          <input
                            type="checkbox"
                            checked=${loop.done}
                            onChange=${(e) => handleToggleOpenLoop(loop.timeStr, e.target.checked)}
                            class="mt-0.5 rounded border-slate-700 bg-slate-800 text-indigo-600 focus:ring-0 cursor-pointer h-4 w-4"
                          />
                          <div class="flex flex-col gap-0.5">
                            <div class="flex items-center gap-1.5 flex-wrap">
                              <span class="font-mono text-xs font-semibold text-indigo-400">${loop.timeStr}</span>
                              <span class="text-[10px] px-2 py-0.2 rounded-full border font-semibold ${badgeClass}">
                                ${badgeLabel}
                              </span>
                            </div>
                            <span class="text-xs ${loop.done ? 'line-through text-slate-500' : 'text-slate-200'}">
                              ${loop.description}
                            </span>
                          </div>
                        </div>

                        ${!loop.done && html`
                          <button
                            onClick=${() => handleRunOpenLoop(loop.timeStr, loop.description)}
                            class="inline-flex items-center gap-1 px-2.5 py-1 rounded-md text-xs font-medium bg-slate-800 hover:bg-slate-700 text-slate-200 border border-white/10 active:scale-95 transition-all cursor-pointer"
                          >
                            <${Icons.Play} />
                            <span>Chạy</span>
                          </button>
                        `}
                      </div>
                    `;
                  })}
                  ${(!cog?.openLoops || cog.openLoops.length === 0) && html`
                    <div class="text-center py-4 text-xs text-slate-400">Không có Open Loop nào.</div>
                  `}
                </div>
              </div>

              <!-- SQLite data.db Stats -->
              ${cog?.dbStats && cog.dbStats.length > 0 && html`
                <div class="p-3.5 rounded-xl bg-slate-900/40 border border-white/10 flex flex-col gap-2">
                  <div class="flex items-center gap-1.5 text-xs font-semibold uppercase tracking-wider text-slate-400">
                    <${Icons.Database} />
                    <span>Hạ tầng Dữ liệu SQLite (data.db)</span>
                  </div>
                  <div class="grid grid-cols-3 gap-2 pt-1">
                    ${cog.dbStats.map(s => html`
                      <div key=${s.table} class="p-2 rounded-lg bg-slate-800/40 border border-white/5 flex flex-col">
                        <span class="font-mono text-[11px] text-slate-400 truncate" title=${s.table}>${s.table}</span>
                        <span class="font-mono text-base font-bold text-slate-100">${s.count}</span>
                      </div>
                    `)}
                  </div>
                </div>
              `}
            </div>
          `}

          <!-- Tab 2: SCHEDULE (Lịch trình bất tử) -->
          ${activeTab === 'schedule' && html`
            <div class="flex flex-col gap-3">
              <!-- Sidecar Protection Info -->
              <div class="p-3.5 rounded-xl bg-slate-900/40 border border-white/10 flex flex-col gap-2">
                <div class="flex items-center gap-1.5 text-xs font-semibold uppercase tracking-wider text-slate-400">
                  <${Icons.Shield} />
                  <span>Bảo vệ Lịch trình Bất tử (Auto-Resurrect)</span>
                </div>
                <p class="text-xs text-slate-400 leading-relaxed">
                  Daemon chạy liên tục 24/7 dưới nền (<code class="font-mono text-indigo-400">restart_policy: always</code>). Nếu bạn tắt Antigravity hoặc crash đột ngột, Daemon sẽ tự đối soát thời gian và kích hoạt Agent chạy bù ngay khi mở lại!
                </p>

                <div class="flex flex-col divide-y divide-white/5 mt-1">
                  ${cog?.schedules?.map((s, idx) => html`
                    <div key=${idx} class="py-2.5 flex flex-col gap-1">
                      <div class="flex items-center gap-2 flex-wrap">
                        <span class="text-[10px] px-2 py-0.5 rounded-full font-bold bg-indigo-500/20 text-indigo-300 border border-indigo-500/30">
                          ${s.type}
                        </span>
                        <span class="font-mono text-xs font-semibold text-indigo-400">${s.expression}</span>
                        <span class="font-mono text-[11px] text-slate-500">(${s.taskId})</span>
                        <span class="text-[10px] px-2 py-0.2 rounded-full font-semibold ${s.status === 'OVERDUE' ? 'bg-rose-500/20 text-rose-300 border border-rose-500/30' : 'bg-emerald-500/20 text-emerald-300 border border-emerald-500/30'}">
                          ${s.status === 'OVERDUE' ? 'Quá hạn / Cần bù' : 'Đang giám sát'}
                        </span>
                      </div>
                      <span class="text-xs text-slate-300">${s.task}</span>
                    </div>
                  `)}
                </div>
              </div>

              <!-- Persistent Schedules Form & List -->
              <div class="p-3.5 rounded-xl bg-slate-900/40 border border-white/10 flex flex-col gap-2.5">
                <div class="flex items-center gap-1.5 text-xs font-semibold uppercase tracking-wider text-slate-400">
                  <${Icons.Clock} />
                  <span>Lịch trình Cố định (SQLite Store)</span>
                </div>

                <div class="flex flex-col divide-y divide-white/5">
                  ${cog?.customSchedules?.map(cs => html`
                    <div key=${cs.id} class="py-2 flex items-center justify-between gap-2">
                      <div class="flex flex-col gap-0.5">
                        <div class="flex items-center gap-2">
                          <span class="font-mono text-xs font-semibold text-indigo-400">${cs.cron_or_time}</span>
                          <span class="text-[10px] px-1.5 py-0.2 rounded font-bold ${cs.enabled ? 'bg-emerald-500/20 text-emerald-300' : 'bg-slate-800 text-slate-500'}">
                            ${cs.enabled ? 'ACTIVE' : 'DONE'}
                          </span>
                        </div>
                        <span class="text-xs text-slate-300">${cs.task_description}</span>
                      </div>
                      <button
                        onClick=${() => handleDeleteSchedule(cs.id)}
                        class="p-1 rounded text-slate-500 hover:text-rose-400 hover:bg-rose-500/10 transition-all cursor-pointer"
                        title="Xóa lịch"
                      >
                        <${Icons.Trash} />
                      </button>
                    </div>
                  `)}
                  ${(!cog?.customSchedules || cog.customSchedules.length === 0) && html`
                    <div class="text-xs text-slate-500 py-2">Chưa có lịch cố định bổ sung.</div>
                  `}
                </div>

                <!-- Add Form -->
                <div class="pt-2 flex flex-col gap-2 border-t border-white/5">
                  <div class="flex gap-2">
                    <select
                      value=${newSched.type}
                      onChange=${e => setNewSched({ ...newSched, type: e.target.value })}
                      class="w-24 bg-slate-950/80 border border-white/10 rounded-lg px-2 py-1.5 text-xs text-slate-200"
                    >
                      <option value="TIMER">TIMER</option>
                      <option value="CRON">CRON</option>
                    </select>
                    <input
                      type="text"
                      placeholder="VD: 2026-10-24 15:00 hoặc 0 */2 * * *"
                      value=${newSched.time}
                      onInput=${e => setNewSched({ ...newSched, time: e.target.value })}
                      class="flex-1 bg-slate-950/80 border border-white/10 rounded-lg px-3 py-1.5 text-xs text-slate-200 font-mono"
                    />
                  </div>
                  <div class="flex gap-2">
                    <input
                      type="text"
                      placeholder="Nội dung nhiệm vụ khi thức dậy..."
                      value=${newSched.desc}
                      onInput=${e => setNewSched({ ...newSched, desc: e.target.value })}
                      class="flex-1 bg-slate-950/80 border border-white/10 rounded-lg px-3 py-1.5 text-xs text-slate-200"
                    />
                    <button
                      onClick=${handleAddSchedule}
                      class="px-3 py-1.5 rounded-lg text-xs font-semibold bg-indigo-600 hover:bg-indigo-500 text-white cursor-pointer active:scale-95 transition-all"
                    >
                      Lưu lịch
                    </button>
                  </div>
                </div>
              </div>

              <!-- Execution Logs -->
              <div class="p-3.5 rounded-xl bg-slate-900/40 border border-white/10 flex flex-col gap-2">
                <div class="flex items-center gap-1.5 text-xs font-semibold uppercase tracking-wider text-slate-400">
                  <${Icons.Activity} />
                  <span>Nhật Ký Đánh Thức Nền (Wakeup Logs)</span>
                </div>
                <div class="flex flex-col divide-y divide-white/5">
                  ${cog?.logs?.map(lg => html`
                    <div key=${lg.id} class="py-2 flex flex-col gap-0.5 text-xs">
                      <div class="flex items-center gap-2">
                        <span class="text-[10px] px-1.5 py-0.2 rounded font-bold ${lg.status === 'SUCCESS' ? 'bg-emerald-500/20 text-emerald-300' : 'bg-rose-500/20 text-rose-300'}">
                          ${lg.status}
                        </span>
                        <span class="font-semibold text-slate-200">${lg.task_type}</span>
                        <span class="font-mono text-[11px] text-slate-400">${lg.triggered_at}</span>
                      </div>
                      <span class="text-slate-400 text-[11px]">Mốc hẹn: <code class="font-mono text-indigo-400">${lg.scheduled_for}</code></span>
                    </div>
                  `)}
                  ${(!cog?.logs || cog.logs.length === 0) && html`
                    <div class="text-xs text-slate-500 py-2">Chưa có lịch sử kích hoạt.</div>
                  `}
                </div>
              </div>
            </div>
          `}

          <!-- Tab 3: INBOX (Phê duyệt kỹ năng) -->
          ${activeTab === 'inbox' && html`
            <div class="flex flex-col gap-3">
              ${cog?.inboxItems?.map(item => {
                const isPending = item.status === 'PENDING';
                let statusBadge = html`<span class="text-[10px] px-2 py-0.5 rounded-full font-bold bg-amber-500/20 text-amber-300 border border-amber-500/30">Chờ duyệt</span>`;
                if (item.status === 'APPROVED') {
                  statusBadge = html`<span class="text-[10px] px-2 py-0.5 rounded-full font-bold bg-emerald-500/20 text-emerald-300 border border-emerald-500/30">Đã duyệt</span>`;
                } else if (item.status === 'REJECTED') {
                  statusBadge = html`<span class="text-[10px] px-2 py-0.5 rounded-full font-bold bg-rose-500/20 text-rose-300 border border-rose-500/30">Từ chối</span>`;
                }

                return html`
                  <div key=${item.id} class="p-3.5 rounded-xl bg-slate-900/40 border border-white/10 flex flex-col gap-2">
                    <div class="flex items-start justify-between gap-2">
                      <div class="flex flex-col">
                        <span class="font-mono text-xs font-bold text-indigo-400">${item.id}</span>
                        <span class="text-xs font-bold text-slate-100">${item.title}</span>
                      </div>
                      ${statusBadge}
                    </div>

                    ${item.reason && html`
                      <div class="text-xs text-slate-300 leading-relaxed">
                        <strong class="text-slate-100">Lý do: </strong>${item.reason}
                      </div>
                    `}

                    ${item.goal && html`
                      <div class="text-xs text-slate-400">
                        <strong class="text-slate-200">Mục tiêu: </strong>${item.goal}
                      </div>
                    `}

                    ${(item.detailLink || item.detailPath) && html`
                      <div class="mt-0.5">
                        <button
                          type="button"
                          onClick=${() => handleOpenFile(item.detailLink, item.detailPath)}
                          class="inline-flex items-center gap-1.5 text-xs text-sky-400 hover:text-sky-300 font-medium underline underline-offset-2 transition-colors py-0.5 cursor-pointer bg-transparent border-0 p-0 text-left group"
                          title="Kích hoạt tab File Viewer trên Auxiliary Pane của Antigravity"
                        >
                          <${Icons.ExternalLink} />
                          <span class="group-hover:text-sky-200">[${item.detailTitle || 'Xem chi tiết bản thảo'}]</span>
                        </button>
                      </div>
                    `}

                    ${isPending && html`
                      <div class="mt-2 pt-2 border-t border-white/5 flex flex-col gap-2">
                        <input
                          type="text"
                          placeholder="Chỉ đạo phê duyệt (tùy chọn)..."
                          value=${inboxNotes[item.id] || ''}
                          onInput=${e => setInboxNotes({ ...inboxNotes, [item.id]: e.target.value })}
                          class="w-full bg-slate-950/80 border border-white/10 rounded-lg px-3 py-1.5 text-xs text-slate-200"
                        />
                        <div class="flex gap-2 justify-end">
                          <button
                            onClick=${() => handleInboxDecision(item.id, 'APPROVED')}
                            class="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-lg text-xs font-semibold bg-emerald-600 hover:bg-emerald-500 text-white cursor-pointer active:scale-95 transition-all shadow-md shadow-emerald-600/20"
                          >
                            <${Icons.Check} />
                            <span>Duyệt & Thực thi</span>
                          </button>
                          <button
                            onClick=${() => handleInboxDecision(item.id, 'REJECTED')}
                            class="inline-flex items-center gap-1 px-3 py-1.5 rounded-lg text-xs font-semibold bg-rose-500/15 hover:bg-rose-500 text-rose-300 hover:text-white border border-rose-500/30 cursor-pointer active:scale-95 transition-all"
                          >
                            <${Icons.X} />
                            <span>Từ chối</span>
                          </button>
                        </div>
                      </div>
                    `}
                  </div>
                `;
              })}
              ${(!cog?.inboxItems || cog.inboxItems.length === 0) && html`
                <div class="text-center py-8 text-xs text-slate-400 bg-slate-900/30 rounded-xl border border-white/10">
                  Hộp thư INBOX.md không có đề xuất nào.
                </div>
              `}
            </div>
          `}

          <!-- Tab 4: DREAMS & SIGNALS (Ký ức) -->
          ${activeTab === 'dreams' && html`
            <div class="flex flex-col gap-3">
              <!-- Dreamer Trigger Card -->
              <div class="p-3.5 rounded-xl bg-slate-900/40 border border-white/10 flex flex-col gap-2">
                <div class="flex items-center justify-between">
                  <div class="flex items-center gap-1.5 text-xs font-semibold uppercase tracking-wider text-slate-400">
                    <${Icons.Moon} />
                    <span>Hợp Nhất Ký Ức 3 Pha</span>
                  </div>
                  <button
                    onClick=${handleTriggerDreamer}
                    class="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-lg text-xs font-semibold bg-gradient-to-r from-indigo-600 to-purple-600 hover:opacity-95 text-white cursor-pointer shadow-md shadow-purple-600/20 active:scale-95 transition-all"
                  >
                    <${Icons.Sparkles} />
                    <span>Chạy Dreamer</span>
                  </button>
                </div>
                <p class="text-xs text-slate-400 leading-relaxed">
                  Chu trình hợp nhất ký ức: <strong>Light Sleep</strong> thu gom Daily Signals ➔ <strong>REM Sleep</strong> đối chiếu giả thuyết DREAMS.md ➔ <strong>Deep Sleep</strong> thăng cấp quy tắc vào MEMORY.md.
                </p>
              </div>

              <!-- Daily Signals Stream -->
              <div class="p-3.5 rounded-xl bg-slate-900/40 border border-white/10 flex flex-col gap-2">
                <div class="flex items-center gap-1.5 text-xs font-semibold uppercase tracking-wider text-slate-400 pb-1 border-b border-white/5">
                  <${Icons.Activity} />
                  <span>Tín Hiệu Trong Ngày (Daily Signals)</span>
                </div>
                <div class="flex flex-col divide-y divide-white/5">
                  ${cog?.signals?.map((sig, idx) => html`
                    <div key=${idx} class="py-2.5 flex flex-col gap-1">
                      <div class="flex items-center gap-2">
                        <span class="font-mono text-xs font-semibold text-indigo-400">${sig.time}</span>
                        <span class="text-[10px] px-2 py-0.2 rounded-full font-bold bg-indigo-500/20 text-indigo-300 border border-indigo-500/30">
                          ${sig.tag}
                        </span>
                      </div>
                      <span class="text-xs text-slate-200">${sig.text}</span>
                    </div>
                  `)}
                  ${(!cog?.signals || cog.signals.length === 0) && html`
                    <div class="text-center py-4 text-xs text-slate-400">Chưa có tín hiệu mới nào trong ngày.</div>
                  `}
                </div>
              </div>
            </div>
          `}

          <!-- Toast Alert -->
          ${toast && html`
            <div class="fixed bottom-4 right-4 left-4 max-w-sm mx-auto p-3 rounded-xl bg-slate-900 text-white border border-indigo-500/50 shadow-2xl flex items-center gap-2 text-xs z-50 animate-bounce">
              <${Icons.AlertCircle} />
              <span class="flex-1">${toast.msg}</span>
            </div>
          `}
        </div>
      `;
    }

    render(html`<${App} />`, document.getElementById('app'));
  </script>
</body>
</html>
